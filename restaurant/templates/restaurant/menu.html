{% load humanize %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ hotel_name }} Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 p-8">
    <h1 class="text-3xl font-bold mb-8 text-center">{{ hotel_name }} Menu</h1>
    {% for category, items in grouped_menu.items %}
    <div class="mb-8">
        <h2 class="text-2xl font-semibold border-b-2 border-amber-200 mb-4">{{ category }}</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for item in items %}
            <div class="bg-white p-4 rounded shadow flex justify-between items-center">
                <div>
                    <p class="font-bold text-lg">{{ item.name }}</p>
                    <p class="text-sm text-gray-500">Available: {{ item.current_stock }}</p>
                </div>
                <p class="text-amber-600 font-bold">UGX {{ item.price|floatformat:0|intcomma }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</body>
</html>
